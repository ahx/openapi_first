openapi: 3.0.0
info:
  title: Media type without schema
  version: '1.0'
paths:
  /thing:
    post:
      requestBody:
        content:
          application/json:
            example: '{"name":"foo"}' # valid: media type with example, no schema
      responses:
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example: '{"errors":["bad"]}' # valid: media type with example, no schema

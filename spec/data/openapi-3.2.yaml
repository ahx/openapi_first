openapi: "3.2.0"
info:
  version: 1.0.0
  title: OpenAPI 3.2 example
paths:
  /files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFile
      responses:
        "200":
          description: "OK"
    additionalOperations:
      COPY:
        operationId: copyFile
        responses:
          "200":
            description: "Copied"
